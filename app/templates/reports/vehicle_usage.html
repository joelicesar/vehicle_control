<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>{{ title }}</h1>

    <!-- Filtros -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Filtros</h5>
        </div>
        <div class="card-body">
            <form method="get" action="{{ url_for('reports.vehicle_usage') }}">
                <div class="row">
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="vehicle_id" class="form-label">Veículo</label>
                            <select name="vehicle_id" id="vehicle_id" class="form-select">
                                <option value="">Todos os Veículos</option>
                                {% for vehicle in vehicles %}
                                <option value="{{ vehicle.id }}" {% if vehicle_id == vehicle.id %}selected{% endif %}>
                                    {{ vehicle.plate }} - {{ vehicle.model }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="start_date" class="form-label">Data Inicial</label>
                            <input type="date" name="start_date" id="start_date" class="form-control" value="{{ start_date }}">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="end_date" class="form-label">Data Final</label>
                            <input type="date" name="end_date" id="end_date" class="form-control" value="{{ end_date }}">
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-filter me-2"></i>Filtrar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Resumo por Veículo -->
    <div class="card mt-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Resumo por Veículo</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Placa</th>
                            <th>Modelo</th>
                            <th>Total de Viagens</th>
                            <th>Distância Total (km)</th>
                            <th>Tempo Total</th>
                            <th>Valor Total (R$)</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for v_id, v_data in vehicles_data.items() %}
                        <tr>
                            <td>{{ v_data.plate }}</td>
                            <td>{{ v_data.model }}</td>
                            <td>{{ v_data.trips|length }}</td>
                            <td>{{ "%.1f"|format(v_data.total_distance) }}</td>
                            <td>{{ v_data.total_time|string|replace('days', 'dias')|replace('day', 'dia') }}</td>
                            <td>R$ {{ "%.2f"|format(v_data.total_amount) }}</td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="6" class="text-center">Nenhuma viagem encontrada para o período selecionado.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Detalhamento por Veículo -->
    {% for v_id, v_data in vehicles_data.items() %}
    <div class="card mt-4">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">Detalhamento - {{ v_data.plate }} ({{ v_data.model }})</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Motorista</th>
                            <th>Departamento</th>
                            <th>Data Início</th>
                            <th>Data Fim</th>
                            <th>Distância (km)</th>
                            <th>Tempo</th>
                            <th>Valor (R$)</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for trip in v_data.trips %}
                        <tr>
                            <td>{{ trip.id }}</td>
                            <td>{{ trip.driver }}</td>
                            <td>{{ trip.department }}</td>
                            <td>{{ trip.start_date.strftime('%d/%m/%Y %H:%M') }}</td>
                            <td>{{ trip.end_date.strftime('%d/%m/%Y %H:%M') if trip.end_date else 'N/A' }}</td>
                            <td>{{ "%.1f"|format(trip.distance) }}</td>
                            <td>{{ trip.time|string|replace('days', 'dias')|replace('day', 'dia') }}</td>
                            <td>R$ {{ "%.2f"|format(trip.amount) }}</td>
                            <td>
                                {% if trip.status == 'completed' %}
                                <span class="badge bg-success">Concluída</span>
                                {% elif trip.status == 'cancelled' %}
                                <span class="badge bg-danger">Cancelada</span>
                                {% else %}
                                <span class="badge bg-warning">{{ trip.status }}</span>
                                {% endif %}
                            </td>
                            <td>
                                <a href="{{ url_for('trips.trip_detail', trip_id=trip.id) }}" class="btn btn-sm btn-info">
                                    <i class="fas fa-eye"></i> Detalhes
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
