<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>{{ title }}</h1>

        <!-- Botão de Exportar para PDF -->
        <a href="{{ url_for('reports.export_billing_pdf', department_id=department_id, start_date=start_date, end_date=end_date) }}"
            class="btn btn-primary">
            <i class="fas fa-file-pdf me-2"></i>Exportar para PDF
        </a>
    </div>

    <!-- Filtros -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Filtros</h5>
        </div>
        <div class="card-body">
            <form method="get" action="{{ url_for('reports.billing') }}">
                <div class="row">
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="department_id" class="form-label">Departamento</label>
                            <select name="department_id" id="department_id" class="form-select">
                                <option value="">Todos os Departamentos</option>
                                {% for department in departments %}
                                <option value="{{ department.id }}" {% if department_id == department.id %}selected{% endif %}>
                                    {{ department.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="start_date" class="form-label">Data Inicial</label>
                            <input type="date" name="start_date" id="start_date" class="form-control" value="{{ start_date }}">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="end_date" class="form-label">Data Final</label>
                            <input type="date" name="end_date" id="end_date" class="form-control" value="{{ end_date }}">
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-filter me-2"></i>Filtrar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Resumo por Departamento -->
    <div class="card mt-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Resumo por Departamento</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Departamento</th>
                            <th>Distância Total (km)</th>
                            <th>Valor Total (R$)</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for dept_id, dept_data in departments_data.items() %}
                        <tr>
                            <td>{{ dept_data.name }}</td>
                            <td>{{ "%.1f"|format(dept_data.total_distance) }}</td>
                            <!-- Calcular o valor corretamente usando a taxa de R$ 2,00 por km -->
                            <td>R$ {{ "%.2f"|format(dept_data.total_distance * 2.00) }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                    <tfoot class="table-secondary">
                        <tr>
                            <th>Total Geral</th>
                            <th>{{ "%.1f"|format(total_distance) }}</th>
                            <!-- Calcular o total geral corretamente -->
                            <th>R$ {{ "%.2f"|format(total_distance * 2.00) }}</th>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <!-- Detalhamento por Departamento -->
    {% for dept_id, dept_data in departments_data.items() %}
    <div class="card mt-4">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">Detalhamento - {{ dept_data.name }}</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Veículo</th>
                            <th>Motorista</th>
                            <th>Data Início</th>
                            <th>Data Fim</th>
                            <th>Distância (km)</th>
                            <th>Valor (R$)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for trip in dept_data.trips %}
                        <tr>
                            <td>{{ trip.id }}</td>
                            <td>{{ trip.vehicle }}</td>
                            <td>{{ trip.driver }}</td>
                            <td>{{ trip.start_date.strftime('%d/%m/%Y %H:%M') }}</td>
                            <td>{{ trip.end_date.strftime('%d/%m/%Y %H:%M') }}</td>
                            <td>{{ "%.1f"|format(trip.distance) }}</td>
                            <!-- Calcular o valor da viagem corretamente -->
                            <td>R$ {{ "%.2f"|format(trip.distance * 2.00) }}</td>
                            <td>
                                <a href="{{ url_for('trips.trip_detail', trip_id=trip.id) }}" class="btn btn-sm btn-info">
                                    <i class="fas fa-eye"></i> Detalhes
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                    <tfoot class="table-secondary">
                        <tr>
                            <th colspan="5" class="text-end">Total do Departamento:</th>
                            <th>{{ "%.1f"|format(dept_data.total_distance) }}</th>
                            <!-- Calcular o total do departamento corretamente -->
                            <th>R$ {{ "%.2f"|format(dept_data.total_distance * 2.00) }}</th>
                            <th></th>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
    {% else %}
    <div class="alert alert-info mt-4">
        <i class="fas fa-info-circle me-2"></i>Nenhuma viagem encontrada para o período selecionado.
    </div>
    {% endfor %}
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
