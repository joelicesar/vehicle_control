<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Relatório de Cobrança</h2>
        <div>
            <a href="{{ url_for('reports.billing', department_id=request.form.get('department_id'), start_date=start_date, end_date=end_date, format='excel') }}" class="btn btn-success">
                <i class="bi bi-file-excel"></i> Exportar Excel
            </a>
            <a href="{{ url_for('reports.billing', department_id=request.form.get('department_id'), start_date=start_date, end_date=end_date, format='pdf') }}" class="btn btn-danger ms-2">
                <i class="bi bi-file-pdf"></i> Exportar PDF
            </a>
            <a href="{{ url_for('reports.billing') }}" class="btn btn-secondary ms-2">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
        </div>
    </div>

    <div class="alert alert-info">
        <strong>Período:</strong> {{ start_date.strftime('%d/%m/%Y') }} a {{ end_date.strftime('%d/%m/%Y') }}
    </div>

    <!-- Resumo por departamento -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Resumo por Departamento</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Departamento</th>
                            <th>Viagens</th>
                            <th>Total KM</th>
                            <th>Valor Total (R$)</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for dept, data in dept_summary.items() %}
                        <tr>
                            <td>{{ dept }}</td>
                            <td class="text-center">{{ data['trips'] }}</td>
                            <td class="text-end">{{ data['total_km']|round(1) }}</td>
                            <td class="text-end">R$ {{ data['amount']|round(2) }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                    <tfoot class="table-secondary">
                        <tr>
                            <th>TOTAL</th>
                            <th class="text-center">{{ trips|length }}</th>
                            <th class="text-end">{{ total_km|round(1) }}</th>
                            <th class="text-end">R$ {{ total_amount|round(2) }}</th>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <!-- Detalhes das viagens -->
    <div class="card">
        <div class="card-header bg-info text-white">
            <h5 class="mb-0">Detalhes das Viagens</h5>
        </div>
        <div class="card-body">
            {% if trips %}
            <div class="table-responsive">
                <table class="table table-striped table-sm">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Veículo</th>
                            <th>Motorista</th>
                            <th>Departamento</th>
                            <th>Data Saída</th>
                            <th>Data Chegada</th>
                            <th>KM Inicial</th>
                            <th>KM Final</th>
                            <th>Distância</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for trip in trips %}
                        <tr>
                            <td>{{ trip.id }}</td>
                            <td>{{ trip.vehicle.plate }}</td>
                            <td>{{ trip.driver.name }}</td>
                            <td>{{ trip.department.name }}</td>
                            <td>{{ trip.start_datetime.strftime('%d/%m/%Y %H:%M') }}</td>
                            <td>{{ trip.end_datetime.strftime('%d/%m/%Y %H:%M') }}</td>
                            <td class="text-end">{{ trip.start_km }}</td>
                            <td class="text-end">{{ trip.end_km }}</td>
                            <td class="text-end">{{ trip.distance|round(1) }}</td>
                            <td class="text-end">R$ {{ trip.charge_amount|round(2) }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <p class="text-center py-3">Não foram encontradas viagens para o período selecionado.</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}

</title>
</head>
<body>

</body>
</html>
