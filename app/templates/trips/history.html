<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block title %}Histórico de Viagens{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Histórico de Viagens</h2>
        <div>
            {% if current_user.type == 'warehouse' %}
            <a href="{{ url_for('trips.dashboard') }}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Voltar para o Dashboard
            </a>
            {% elif current_user.type == 'manager' %}
            <a href="{{ url_for('reports.dashboard') }}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Voltar para o Dashboard
            </a>
            {% endif %}
        </div>
    </div>

    <!-- Filtros de pesquisa -->
    <div class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0">Filtros</h5>
        </div>
        <div class="card-body">
            <form method="GET" action="{{ url_for('trips.history') }}" class="row g-3">
                <div class="col-md-4">
                    <label for="vehicle_id" class="form-label">Veículo</label>
                    <select class="form-select" id="vehicle_id" name="vehicle_id">
                        <option value="">Todos</option>
                        {% for vehicle in vehicles %}
                        <option value="{{ vehicle.id }}" {% if vehicle_id == vehicle.id|string %}selected{% endif %}>
                            {{ vehicle.plate }} - {{ vehicle.model }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="driver_id" class="form-label">Motorista</label>
                    <select class="form-select" id="driver_id" name="driver_id">
                        <option value="">Todos</option>
                        {% for driver in drivers %}
                        <option value="{{ driver.id }}" {% if driver_id == driver.id|string %}selected{% endif %}>
                            {{ driver.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="department_id" class="form-label">Departamento</label>
                    <select class="form-select" id="department_id" name="department_id">
                        <option value="">Todos</option>
                        {% for department in departments %}
                        <option value="{{ department.id }}" {% if department_id == department.id|string %}selected{% endif %}>
                            {{ department.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="start_date" class="form-label">Data Inicial</label>
                    <input type="date" class="form-control" id="start_date" name="start_date" value="{{ start_date }}">
                </div>
                <div class="col-md-6">
                    <label for="end_date" class="form-label">Data Final</label>
                    <input type="date" class="form-control" id="end_date" name="end_date" value="{{ end_date }}">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> Filtrar
                    </button>
                    <a href="{{ url_for('trips.history') }}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Limpar Filtros
                    </a>

                    {% if current_user.type == 'manager' %}
                    <a href="{{ url_for('reports.billing') }}" class="btn btn-success float-end">
                        <i class="bi bi-cash"></i> Gerar Relatório de Cobrança
                    </a>
                    {% endif %}
                </div>
            </form>
        </div>
    </div>

    <!-- Lista de viagens -->
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Viagens Realizadas</h5>
        </div>
        <div class="card-body">
            {% if trips %}
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Veículo</th>
                            <th>Motorista</th>
                            <th>Departamento</th>
                            <th>Saída</th>
                            <th>Chegada</th>
                            <th>Distância</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for trip in trips %}
                        <tr>
                            <td>{{ trip.id }}</td>
                            <td>{{ trip.vehicle.plate }}</td>
                            <td>{{ trip.driver.name }}</td>
                            <td>{{ trip.department.name }}</td>
                            <td>{{ trip.start_datetime|datetimeformat('%d/%m/%Y %H:%M') }}</td>
                            <td>{{ trip.end_datetime|datetimeformat('%d/%m/%Y %H:%M') }}</td>
                            <td>{{ trip.distance|round(1) }} km</td>
                            <td>R$ {{ trip.charge_amount|round(2) }}</td>
                            <td>
                                <a href="{{ url_for('trips.trip_detail', trip_id=trip.id) }}" class="btn btn-info btn-sm">
                                    <i class="bi bi-eye"></i> Detalhes
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <div class="text-center py-4">
                <i class="bi bi-clock-history fs-1 text-muted"></i>
                <p class="text-muted">Nenhuma viagem encontrada com os filtros selecionados.</p>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
