<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block title %}Confirmar Cancelamento de Viagem #{{ trip.id }}{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Confirmar Cancelamento de Viagem #{{ trip.id }}</h2>
        <a href="{{ url_for('trips.dashboard') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Voltar para o Dashboard
        </a>
    </div>

    <div class="alert alert-danger" role="alert">
        <h4 class="alert-heading"><i class="bi bi-exclamation-triangle-fill"></i> Atenção!</h4>
        <p>Você está prestes a cancelar a seguinte viagem. Esta ação não pode ser desfeita.</p>
        <hr>
        <p class="mb-0">Por favor, revise os detalhes da viagem abaixo antes de confirmar o cancelamento.</p>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0">Detalhes da Viagem a Ser Cancelada</h5>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>ID da Viagem:</strong> {{ trip.id }}</p>
                    <p><strong>Veículo:</strong> {{ trip.vehicle.plate }} - {{ trip.vehicle.model }}</p>
                    <p><strong>Motorista:</strong> {{ trip.driver.name }}</p>
                </div>
                <div class="col-md-6">
                    <p><strong>Departamento:</strong> {{ trip.department.name }}</p>
                    <p><strong>Saída:</strong> {{ trip.start_datetime.strftime('%d/%m/%Y %H:%M') }}</p>
                    <p><strong>KM Inicial:</strong> {{ trip.start_km }} km</p>
                </div>
            </div>
            <p class="mt-3"><strong>Finalidade:</strong> {{ trip.purpose or 'Não informada' }}</p>
            <p><strong>Status Atual:</strong>
                {% if trip.status == 'in_progress' %}
                    <span class="badge bg-warning">Em Andamento</span>
                {% elif trip.status == 'scheduled' %}
                    <span class="badge bg-primary">Agendada</span>
                {% else %}
                    <span class="badge bg-secondary">{{ trip.status|capitalize }}</span>
                {% endif %}
            </p>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0">Confirmação de Cancelamento</h5>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('trips.cancel_trip', trip_id=trip.id) }}">
                {{ form.hidden_tag() }} {# Assumindo que você terá um formulário simples com CSRF #}
                <p>Para confirmar o cancelamento, clique no botão abaixo.</p>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <a href="{{ url_for('trips.trip_detail', trip_id=trip.id) }}" class="btn btn-secondary me-md-2">Voltar</a>
                    {{ form.submit(class="btn btn-danger", value="Confirmar Cancelamento") }}
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
