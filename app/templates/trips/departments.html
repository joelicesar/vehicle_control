<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gerenciamento de Departamentos</h2>
        <a href="{{ url_for('trips.add_department') }}" class="btn btn-primary">
            <i class="bi bi-building-add"></i> Adicionar Departamento
        </a>
    </div>

    <!-- Filtros de pesquisa -->
    <div class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0">Filtros</h5>
        </div>
        <div class="card-body">
            <form method="GET" action="{{ url_for('trips.departments') }}" class="row g-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ request.args.get('name', '') }}">
                </div>
                <div class="col-md-6">
                    <label for="cost_center" class="form-label">Centro de Custo</label>
                    <input type="text" class="form-control" id="cost_center" name="cost_center" value="{{ request.args.get('cost_center', '') }}">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> Filtrar
                    </button>
                    <a href="{{ url_for('trips.departments') }}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Limpar Filtros
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Lista de departamentos -->
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Departamentos Cadastrados</h5>
        </div>
        <div class="card-body">
            {% if departments %}
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Centro de Custo</th>
                            <th>Motoristas</th>
                            <th>Viagens</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for department in departments %}
                        <tr>
                            <td>{{ department.name }}</td>
                            <td>{{ department.cost_center }}</td>
                            <td>{{ department.drivers|length }}</td>
                            <td>{{ department.trips|length }}</td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <a href="{{ url_for('trips.edit_department', department_id=department.id) }}" class="btn btn-warning">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteDepartmentModal{{ department.id }}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>

                                <!-- Modal de confirmação de exclusão -->
                                <div class="modal fade" id="deleteDepartmentModal{{ department.id }}" tabindex="-1" aria-labelledby="deleteDepartmentModalLabel{{ department.id }}" aria-hidden="true">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header bg-danger text-white">
                                                <h5 class="modal-title" id="deleteDepartmentModalLabel{{ department.id }}">Confirmar Exclusão</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <div class="modal-body">
                                                <p>Tem certeza que deseja excluir o departamento <strong>{{ department.name }}</strong>?</p>
                                                <p class="text-danger"><small>Esta ação não pode ser desfeita.</small></p>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                                <form action="{{ url_for('trips.delete_department', department_id=department.id) }}" method="POST" class="d-inline">
                                                    <input type="hidden" name="_method" value="DELETE">
                                                    <button type="submit" class="btn btn-danger">Excluir</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <div class="text-center py-4">
                <i class="bi bi-building-x fs-1 text-muted"></i>
                <p class="text-muted">Nenhum departamento encontrado.</p>
                <a href="{{ url_for('trips.add_department') }}" class="btn btn-primary">
                    <i class="bi bi-building-add"></i> Adicionar Departamento
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}</title>
</head>
<body>

</body>
</html>
