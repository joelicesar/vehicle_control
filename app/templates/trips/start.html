<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Registrar Saída de Veículo</h2>

    <form method="POST" action="">
        {{ form.hidden_tag() }}

        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Informações da Saída</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="vehicle_id" class="form-label">Veículo:</label>
                        {{ form.vehicle_id(class="form-select", id="vehicle_id") }}
                        {% if form.vehicle_id.errors %}
                            <div class="text-danger">
                                {% for error in form.vehicle_id.errors %}
                                    {{ error }}
                                {% endfor %}
                            </div>
                        {% endif %}
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="driver_id" class="form-label">Motorista:</label>
                        {{ form.driver_id(class="form-select", id="driver_id") }}
                        {% if form.driver_id.errors %}
                            <div class="text-danger">
                                {% for error in form.driver_id.errors %}
                                    {{ error }}
                                {% endfor %}
                            </div>
                        {% endif %}
                    </div>
                </div>

                <div class="mb-3">
                    <label for="department_id" class="form-label">Departamento:</label>
                    {{ form.department_id(class="form-select", id="department_id") }}
                    {% if form.department_id.errors %}
                        <div class="text-danger">
                            {% for error in form.department_id.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="start_km" class="form-label">Quilometragem de Saída:</label>
                    {{ form.start_km(class="form-control", id="start_km") }}
                    {% if form.start_km.errors %}
                        <div class="text-danger">
                            {% for error in form.start_km.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="vehicle_condition" class="form-label">Estado do Veículo:</label>
                    {{ form.vehicle_condition(class="form-control", rows=3, id="vehicle_condition") }}
                    {% if form.vehicle_condition.errors %}
                        <div class="text-danger">
                            {% for error in form.vehicle_condition.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="start_notes" class="form-label">Observações:</label>
                    {{ form.start_notes(class="form-control", rows=3, id="start_notes") }}
                    {% if form.start_notes.errors %}
                        <div class="text-danger">
                            {% for error in form.start_notes.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{{ url_for('trips.dashboard') }}" class="btn btn-secondary">Cancelar</a>
            {{ form.submit(class="btn btn-primary") }}
        </div>
    </form>
</div>
{% endblock %}</title>
</head>
<body>

</body>
</html>
