<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block title %}Registrar Chegada de Veículo{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Registrar Chegada de Veículo</h2>
        <a href="{{ url_for('trips.dashboard') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Voltar para o Dashboard
        </a>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-info text-white">
            <h5 class="mb-0">Detalhes da Viagem em Andamento</h5>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>ID da Viagem:</strong> {{ trip.id }}</p>
                    <p><strong>Veículo:</strong> {{ trip.vehicle.plate }} - {{ trip.vehicle.model }}</p>
                    <p><strong>Motorista:</strong> {{ trip.driver.name }}</p>
                </div>
                <div class="col-md-6">
                    <p><strong>Departamento:</strong> {{ trip.department.name }}</p>
                    <p><strong>Saída:</strong> {{ trip.start_datetime.strftime('%d/%m/%Y %H:%M') }}</p>
                    <p><strong>KM Inicial:</strong> {{ trip.start_km }} km</p>
                </div>
            </div>
            <p class="mt-3"><strong>Finalidade:</strong> {{ trip.purpose or 'Não informada' }}</p>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">Dados da Chegada</h5>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('trips.end_trip', trip_id=trip.id) }}">
                {{ form.hidden_tag() }}

                <div class="mb-3">
                    <label for="end_km" class="form-label">Quilometragem de Chegada:</label>
                    {{ form.end_km(class="form-control", id="end_km") }}
                    {% if form.end_km.errors %}
                        <div class="text-danger">
                            {% for error in form.end_km.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="vehicle_condition_end" class="form-label">Estado do Veículo na Chegada (opcional):</label>
                    {{ form.vehicle_condition_end(class="form-control", id="vehicle_condition_end", rows="3") }}
                    {% if form.vehicle_condition_end.errors %}
                        <div class="text-danger">
                            {% for error in form.vehicle_condition_end.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="end_notes" class="form-label">Observações na Chegada (opcional):</label>
                    {{ form.end_notes(class="form-control", id="end_notes", rows="3") }}
                    {% if form.end_notes.errors %}
                        <div class="text-danger">
                            {% for error in form.end_notes.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <a href="{{ url_for('trips.dashboard') }}" class="btn btn-secondary me-md-2">Cancelar</a>
                    {{ form.submit(class="btn btn-success", value="Finalizar Viagem") }}
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
