<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block title %}Dashboard Almoxarifado{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Dashboard do Almoxarifado</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <div class="btn-group me-2">
                <a href="{{ url_for('trips.start_trip') }}" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-box-arrow-right"></i> Registrar Saída
                </a>
                <a href="{{ url_for('trips.active') }}" class="btn btn-sm btn-outline-info">
                    <i class="bi bi-car-front"></i> Viagens em Andamento
                </a>
                <a href="{{ url_for('trips.history') }}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-clock-history"></i> Histórico de Viagens
                </a>
                <a href="{{ url_for('schedules.calendar') }}" class="btn btn-sm btn-outline-dark">
                    <i class="bi bi-calendar-event"></i> Agendamentos
                </a>
            </div>
        </div>
    </div>

    <!-- Cards de estatísticas -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card text-white bg-primary">
                <div class="card-body">
                    <h5 class="card-title">Veículos Disponíveis</h5>
                    <p class="card-text display-4">{{ available_vehicles }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <h5 class="card-title">Viagens Concluídas Hoje</h5>
                    <p class="card-text display-4">{{ completed_trips_today }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-warning">
                <div class="card-body">
                    <h5 class="card-title">Viagens em Andamento</h5>
                    <p class="card-text display-4">{{ active_trips|length }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-info">
                <div class="card-body">
                    <h5 class="card-title">Próximos Agendamentos</h5>
                    <p class="card-text display-4">{{ upcoming_schedules }}</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Viagens em andamento -->
    <div class="row">
        <div class="col-12">
            <div class="card mb-4">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">Viagens em Andamento</h5>
                </div>
                <div class="card-body">
                    {% if active_trips %}
                    <div class="table-responsive">
                        <table class="table table-striped table-sm">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Veículo</th>
                                    <th>Motorista</th>
                                    <th>Departamento</th>
                                    <th>Saída</th>
                                    <th>KM Inicial</th>
                                    <th>Tempo de Viagem</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for trip in active_trips %}
                                <tr>
                                    <td>{{ trip.id }}</td>
                                    <td>{{ trip.vehicle.plate }} - {{ trip.vehicle.model }}</td>
                                    <td>{{ trip.driver.name }}</td>
                                    <td>{{ trip.department.name }}</td>
                                    <td>{{ trip.start_datetime.strftime('%d/%m/%Y %H:%M') }}</td>
                                    <td>{{ trip.start_km }}</td>
                                    <td>
                                        {% set duration = (now - trip.start_datetime).total_seconds() // 60 %}
                                        {% if duration < 60 %}
                                            {{ duration|int }} minutos
                                        {% else %}
                                            {{ (duration // 60)|int }} horas e {{ (duration % 60)|int }} minutos
                                        {% endif %}
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a href="{{ url_for('trips.trip_detail', trip_id=trip.id) }}" class="btn btn-info">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a href="{{ url_for('trips.end_trip', trip_id=trip.id) }}" class="btn btn-success">
                                                <i class="bi bi-box-arrow-in-left"></i> Chegada
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                    {% else %}
                    <div class="text-center py-3">
                        <i class="bi bi-info-circle text-muted fs-1"></i>
                        <p class="text-muted">Não há viagens em andamento no momento.</p>
                        <a href="{{ url_for('trips.start_trip') }}" class="btn btn-primary">
                            <i class="bi bi-box-arrow-right"></i> Registrar Saída
                        </a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>

    <!-- Próximos Agendamentos -->
    <div class="row">
        <div class="col-12">
            <div class="card mb-4">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">Próximos Agendamentos</h5>
                </div>
                <div class="card-body">
                    {% if upcoming_schedules_list %}
                    <div class="table-responsive">
                        <table class="table table-striped table-sm">
                            <thead>
                                <tr>
                                    <th>Veículo</th>
                                    <th>Motorista</th>
                                    <th>Departamento</th>
                                    <th>Início</th>
                                    <th>Término Previsto</th>
                                    <th>Finalidade</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for schedule in upcoming_schedules_list %}
                                <tr>
                                    <td>{{ schedule.vehicle.plate }} - {{ schedule.vehicle.model }}</td>
                                    <td>{{ schedule.driver.name }}</td>
                                    <td>{{ schedule.department.name }}</td>
                                    <td>{{ schedule.start_datetime.strftime('%d/%m/%Y %H:%M') }}</td>
                                    <td>{{ schedule.end_datetime.strftime('%d/%m/%Y %H:%M') }}</td>
                                    <td>{{ schedule.purpose }}</td>
                                    <td>
                                        <a href="{{ url_for('schedules.detail_schedule', schedule_id=schedule.id) }}" class="btn btn-sm btn-info">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a href="{{ url_for('schedules.edit_schedule', schedule_id=schedule.id) }}" class="btn btn-sm btn-warning">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                    {% else %}
                    <div class="text-center py-3">
                        <i class="bi bi-calendar-check fs-1 text-muted"></i>
                        <p class="text-muted">Nenhum agendamento futuro encontrado.</p>
                        <a href="{{ url_for('schedules.add_schedule') }}" class="btn btn-primary">
                            <i class="bi bi-calendar-plus"></i> Agendar Veículo
                        </a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
