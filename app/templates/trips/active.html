<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block title %}Viagens em Andamento{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Viagens em Andamento</h2>
        <a href="{{ url_for('trips.dashboard') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Voltar para o Dashboard
        </a>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Viagens Ativas</h5>
        </div>
        <div class="card-body">
            {% if trips %}
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Veículo</th>
                            <th>Motorista</th>
                            <th>Departamento</th>
                            <th>Saída</th>
                            <th>KM Inicial</th>
                            <th>Tempo de Viagem</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for trip in trips %}
                        <tr>
                            <td>{{ trip.id }}</td>
                            <td>{{ trip.vehicle.plate }}</td>
                            <td>{{ trip.driver.name }}</td>
                            <td>{{ trip.department.name }}</td>
                            <td>{{ trip.start_datetime.strftime('%d/%m/%Y %H:%M') }}</td>
                            <td>{{ trip.start_km }}</td>
                            <td>
                                {% set duration = (now - trip.start_datetime).total_seconds() // 60 %}
                                {% if duration < 60 %}
                                    {{ duration|int }} minutos
                                {% else %}
                                    {{ (duration // 60)|int }} horas e {{ (duration % 60)|int }} minutos
                                {% endif %}
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <a href="{{ url_for('trips.trip_detail', trip_id=trip.id) }}" class="btn btn-info">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a href="{{ url_for('trips.end_trip', trip_id=trip.id) }}" class="btn btn-success">
                                        <i class="bi bi-box-arrow-in-left"></i> Chegada
                                    </a>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <div class="text-center py-4">
                <i class="bi bi-car-front fs-1 text-muted"></i>
                <p class="text-muted">Não há viagens em andamento no momento.</p>
                <a href="{{ url_for('trips.start_trip') }}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-right"></i> Registrar Saída
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
