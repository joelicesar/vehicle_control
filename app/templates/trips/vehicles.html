<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Veículos</h2>
        <a href="{{ url_for('trips.add_vehicle') }}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Adicionar Veículo
        </a>
    </div>

    {% if vehicles %}
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Placa</th>
                    <th>Modelo</th>
                    <th>Ano</th>
                    <th>Quilometragem</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for vehicle in vehicles %}
                <tr>
                    <td><strong>{{ vehicle.plate }}</strong></td>
                    <td>{{ vehicle.model }}</td>
                    <td>{{ vehicle.year }}</td>
                    <td>{{ format_distance(vehicle.current_km) }}</td>
                    <td>
                        {% if vehicle.status == 'available' %}
                            <span class="badge bg-success">Disponível</span>
                        {% elif vehicle.status == 'in_use' %}
                            <span class="badge bg-warning">Em Uso</span>
                        {% elif vehicle.status == 'maintenance' %}
                            <span class="badge bg-danger">Em Manutenção</span>
                        {% endif %}
                    </td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <a href="{{ url_for('trips.edit_vehicle', vehicle_id=vehicle.id) }}" class="btn btn-primary">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                            {% if vehicle.status == 'available' %}
                            <a href="{{ url_for('trips.delete_vehicle', vehicle_id=vehicle.id) }}" class="btn btn-danger" onclick="return confirm('Tem certeza que deseja excluir este veículo?');">
                                <i class="bi bi-trash"></i> Excluir
                            </a>
                            {% endif %}
                            {% if vehicle.status == 'available' %}
                            <a href="{{ url_for('trips.start_trip') }}" class="btn btn-success">
                                <i class="bi bi-box-arrow-right"></i> Saída
                            </a>
                            {% endif %}
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <div class="alert alert-info">
        <i class="bi bi-info-circle"></i> Não há veículos cadastrados.
    </div>
    {% endif %}
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
