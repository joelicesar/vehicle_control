<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Editar Departamento</h2>
        <a href="{{ url_for('trips.departments') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Dados do Departamento</h5>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('trips.edit_department', department_id=department.id) }}">
                {{ form.hidden_tag() }}

                <div class="mb-3">
                    <label for="name" class="form-label">Nome:</label>
                    {{ form.name(class="form-control", id="name") }}
                    {% if form.name.errors %}
                        <div class="text-danger">
                            {% for error in form.name.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="cost_center" class="form-label">Centro de Custo:</label>
                    {{ form.cost_center(class="form-control", id="cost_center") }}
                    {% if form.cost_center.errors %}
                        <div class="text-danger">
                            {% for error in form.cost_center.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="{{ url_for('trips.departments') }}" class="btn btn-secondary me-md-2">Cancelar</a>
                    {{ form.submit(class="btn btn-primary") }}
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}</title>
</head>
<body>

</body>
</html>
