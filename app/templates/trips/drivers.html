<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gerenciamento de Motoristas</h2>
        <a href="{{ url_for('trips.add_driver') }}" class="btn btn-primary">
            <i class="bi bi-person-plus"></i> Adicionar Motorista
        </a>
    </div>

    <!-- Filtros de pesquisa -->
    <div class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0">Filtros</h5>
        </div>
        <div class="card-body">
            <form method="GET" action="{{ url_for('trips.drivers') }}" class="row g-3">
                <div class="col-md-4">
                    <label for="name" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ request.args.get('name', '') }}">
                </div>
                <div class="col-md-4">
                    <label for="department" class="form-label">Departamento</label>
                    <select class="form-select" id="department" name="department">
                        <option value="">Todos</option>
                        {% for dept in departments %}
                        <option value="{{ dept.id }}" {% if request.args.get('department') == dept.id|string %}selected{% endif %}>{{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="license_status" class="form-label">Status da CNH</label>
                    <select class="form-select" id="license_status" name="license_status">
                        <option value="">Todos</option>
                        <option value="valid" {% if request.args.get('license_status') == 'valid' %}selected{% endif %}>Válida</option>
                        <option value="expired" {% if request.args.get('license_status') == 'expired' %}selected{% endif %}>Vencida</option>
                        <option value="expiring" {% if request.args.get('license_status') == 'expiring' %}selected{% endif %}>A vencer</option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> Filtrar
                    </button>
                    <a href="{{ url_for('trips.drivers') }}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Limpar Filtros
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Lista de motoristas -->
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Motoristas Cadastrados</h5>
        </div>
        <div class="card-body">
            {% if drivers %}
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Departamento</th>
                            <th>Número da CNH</th>
                            <th>Validade da CNH</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for driver in drivers %}
                        <tr>
                            <td>{{ driver.name }}</td>
                            <td>{{ driver.department.name }}</td>
                            <td>{{ driver.license_number }}</td>
                            <td>{{ driver.license_expiry.strftime('%d/%m/%Y') }}</td>
                            <td>
                                {% if driver.license_expiry < now %}
                                <span class="badge bg-danger">Vencida</span>
                                {% elif (driver.license_expiry - now).days <= 30 %}
                                <span class="badge bg-warning">A vencer em {{ (driver.license_expiry - now).days }} dias</span>
                                {% else %}
                                <span class="badge bg-success">Válida</span>
                                {% endif %}
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <a href="{{ url_for('trips.edit_driver', driver_id=driver.id) }}" class="btn btn-warning">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteDriverModal{{ driver.id }}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>

                                <!-- Modal de confirmação de exclusão -->
                                <div class="modal fade" id="deleteDriverModal{{ driver.id }}" tabindex="-1" aria-labelledby="deleteDriverModalLabel{{ driver.id }}" aria-hidden="true">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header bg-danger text-white">
                                                <h5 class="modal-title" id="deleteDriverModalLabel{{ driver.id }}">Confirmar Exclusão</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <div class="modal-body">
                                                <p>Tem certeza que deseja excluir o motorista <strong>{{ driver.name }}</strong>?</p>
                                                <p class="text-danger"><small>Esta ação não pode ser desfeita.</small></p>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                                <form action="{{ url_for('trips.delete_driver', driver_id=driver.id) }}" method="POST" class="d-inline">
                                                    <input type="hidden" name="_method" value="DELETE">
                                                    <button type="submit" class="btn btn-danger">Excluir</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <div class="text-center py-4">
                <i class="bi bi-person-x fs-1 text-muted"></i>
                <p class="text-muted">Nenhum motorista encontrado.</p>
                <a href="{{ url_for('trips.add_driver') }}" class="btn btn-primary">
                    <i class="bi bi-person-plus"></i> Adicionar Motorista
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
