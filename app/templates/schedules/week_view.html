<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block title %}Agendamentos da Semana{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Agendamentos da Semana</h2>
        <a href="{{ url_for('schedules.calendar') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Voltar para o Calendário
        </a>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Semana de {{ start_of_week.strftime('%d/%m/%Y') }} a {{ end_of_week.strftime('%d/%m/%Y') }}</h5>
        </div>
        <div class="card-body">
            {% if days %}
                {% for day_data in days %}
                <div class="mb-4">
                    <h4>{{ day_data.date.strftime('%A, %d de %B') }}</h4>
                    {% if day_data.schedules %}
                    <div class="table-responsive">
                        <table class="table table-striped table-sm">
                            <thead>
                                <tr>
                                    <th>Veículo</th>
                                    <th>Motorista</th>
                                    <th>Departamento</th>
                                    <th>Início</th>
                                    <th>Término Previsto</th>
                                    <th>Finalidade</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for schedule in day_data.schedules %}
                                <tr>
                                    <td>{{ schedule.vehicle.plate }}</td>
                                    <td>{{ schedule.driver.name }}</td>
                                    <td>{{ schedule.department.name }}</td>
                                    <td>{{ schedule.start_datetime.strftime('%H:%M') }}</td>
                                    <td>{{ schedule.end_datetime.strftime('%H:%M') }}</td>
                                    <td>{{ schedule.purpose }}</td>
                                    <td>
                                        {% if schedule.status == 'scheduled' %}
                                        <span class="badge bg-info">Agendado</span>
                                        {% elif schedule.status == 'confirmed' %}
                                        <span class="badge bg-success">Confirmado</span>
                                        {% elif schedule.status == 'cancelled' %}
                                        <span class="badge bg-danger">Cancelado</span>
                                        {% endif %}
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a href="{{ url_for('schedules.detail_schedule', schedule_id=schedule.id) }}" class="btn btn-info">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a href="{{ url_for('schedules.edit_schedule', schedule_id=schedule.id) }}" class="btn btn-warning">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                    {% else %}
                    <p class="text-muted">Nenhum agendamento para este dia.</p>
                    {% endif %}
                </div>
                {% endfor %}
            {% else %}
            <div class="text-center py-4">
                <i class="bi bi-calendar-x fs-1 text-muted"></i>
                <p class="text-muted">Nenhum agendamento encontrado para esta semana.</p>
                <a href="{{ url_for('schedules.add_schedule') }}" class="btn btn-primary">
                    <i class="bi bi-calendar-plus"></i> Agendar Veículo
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
