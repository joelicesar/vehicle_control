<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Detalhes do Agendamento #{{ schedule.id }}</h2>
        <div>
            <a href="{{ url_for('schedules.index') }}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
            {% if schedule.status in ['scheduled', 'confirmed'] %}
            <a href="{{ url_for('schedules.edit', schedule_id=schedule.id) }}" class="btn btn-primary ms-2">
                <i class="bi bi-pencil"></i> Editar
            </a>
            {% if schedule.status == 'scheduled' %}
            <a href="{{ url_for('schedules.confirm', schedule_id=schedule.id) }}" class="btn btn-success ms-2">
                <i class="bi bi-check-circle"></i> Confirmar
            </a>
            {% endif %}
            <a href="{{ url_for('schedules.cancel', schedule_id=schedule.id) }}" class="btn btn-danger ms-2" onclick="return confirm('Tem certeza que deseja cancelar este agendamento?');">
                <i class="bi bi-x-circle"></i> Cancelar
            </a>
            {% endif %}
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Informações do Agendamento</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <h6>Status:</h6>
                        {% if schedule.status == 'scheduled' %}
                            <span class="badge bg-warning badge-status">Agendado</span>
                        {% elif schedule.status == 'confirmed' %}
                            <span class="badge bg-success badge-status">Confirmado</span>
                        {% elif schedule.status == 'cancelled' %}
                            <span class="badge bg-danger badge-status">Cancelado</span>
                        {% elif schedule.status == 'completed' %}
                            <span class="badge bg-info badge-status">Concluído</span>
                        {% endif %}
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <h6>Veículo:</h6>
                            <p>{{ schedule.vehicle.plate }} - {{ schedule.vehicle.model }}</p>
                        </div>
                        <div class="col-md-6">
                            <h6>Motorista:</h6>
                            <p>{{ schedule.driver.name }}</p>
                        </div>
                    </div>

                    <div class="mb-3">
                        <h6>Departamento:</h6>
                        <p>{{ schedule.department.name }} ({{ schedule.department.cost_center }})</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">Período</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <h6>Data/Hora de Início:</h6>
                            <p>{{ schedule.start_datetime|datetime }}</p>
                        </div>
                        <div class="col-md-6">
                            <h6>Data/Hora de Término:</h6>
                            <p>{{ schedule.end_datetime|datetime }}</p>
                        </div>
                    </div>

                    <div class="mb-3">
                        <h6>Duração:</h6>
                        {% set duration = (schedule.end_datetime - schedule.start_datetime).total_seconds() // 60 %}
                        <p>
                            {% if duration < 60 %}
                                {{ duration|int }} minutos
                            {% else %}
                                {{ (duration // 60)|int }} horas e {{ (duration % 60)|int }} minutos
                            {% endif %}
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {% if schedule.purpose %}
    <div class="row">
        <div class="col-12">
            <div class="card mb-4">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0">Finalidade da Viagem</h5>
                </div>
                <div class="card-body">
                    <p>{{ schedule.purpose }}</p>
                </div>
            </div>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
