<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block title %}Editar Agendamento #{{ schedule.id }}{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Editar Agendamento #{{ schedule.id }}</h2>
        <a href="{{ url_for('schedules.calendar') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Voltar para o Calendário
        </a>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Detalhes do Agendamento</h5>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('schedules.edit_schedule', schedule_id=schedule.id) }}">
                {{ form.hidden_tag() }}

                <div class="mb-3">
                    <label for="vehicle_id" class="form-label">Veículo:</label>
                    {{ form.vehicle_id(class="form-select", id="vehicle_id") }}
                    {% if form.vehicle_id.errors %}
                        <div class="text-danger">
                            {% for error in form.vehicle_id.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="driver_id" class="form-label">Motorista:</label>
                    {{ form.driver_id(class="form-select", id="driver_id") }}
                    {% if form.driver_id.errors %}
                        <div class="text-danger">
                            {% for error in form.driver_id.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="department_id" class="form-label">Departamento:</label>
                    {{ form.department_id(class="form-select", id="department_id") }}
                    {% if form.department_id.errors %}
                        <div class="text-danger">
                            {% for error in form.department_id.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="start_datetime" class="form-label">Data/Hora de Início:</label>
                    {{ form.start_datetime(class="form-control", id="start_datetime", type="datetime-local") }}
                    {% if form.start_datetime.errors %}
                        <div class="text-danger">
                            {% for error in form.start_datetime.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="end_datetime" class="form-label">Data/Hora de Término Previsto:</label>
                    {{ form.end_datetime(class="form-control", id="end_datetime", type="datetime-local") }}
                    {% if form.end_datetime.errors %}
                        <div class="text-danger">
                            {% for error in form.end_datetime.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="purpose" class="form-label">Finalidade da Viagem:</label>
                    {{ form.purpose(class="form-control", id="purpose", rows="3") }}
                    {% if form.purpose.errors %}
                        <div class="text-danger">
                            {% for error in form.purpose.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="{{ url_for('schedules.calendar') }}" class="btn btn-secondary me-md-2">Cancelar</a>
                    {{ form.submit(class="btn btn-primary") }}
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
