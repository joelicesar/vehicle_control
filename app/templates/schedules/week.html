<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Agendamentos da Semana</h2>
        <div>
            <a href="{{ url_for('schedules.index') }}" class="btn btn-secondary">
                <i class="bi bi-list"></i> Lista de Agendamentos
            </a>
            <a href="{{ url_for('schedules.calendar') }}" class="btn btn-info ms-2">
                <i class="bi bi-calendar3"></i> Calendário
            </a>
            <a href="{{ url_for('schedules.add_schedule') }}" class="btn btn-primary ms-2">
                <i class="bi bi-plus-circle"></i> Novo Agendamento
            </a>
        </div>
    </div>

    <div class="alert alert-info">
        <i class="bi bi-calendar-week"></i> 
        Semana de <strong>{{ start_of_week.strftime('%d/%m/%Y') }}</strong> a <strong>{{ end_of_week.strftime('%d/%m/%Y') }}</strong>
    </div>

    <div class="row">
        {% for day in days %}
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-header {% if day.date == now.date() %}bg-primary text-white{% else %}bg-light{% endif %}">
                    <h5 class="mb-0">
                        {{ day.date.strftime('%A') }} - {{ day.date.strftime('%d/%m/%Y') }}
                        {% if day.date == now.date() %}
                        <span class="badge bg-warning text-dark">Hoje</span>
                        {% endif %}
                    </h5>
                </div>
                <div class="card-body">
                    {% if day.schedules %}
                    <div class="list-group">
                        {% for schedule in day.schedules %}
                        <div class="list-group-item list-group-item-action">
                            <div class="d-flex w-100 justify-content-between">
                                <h6 class="mb-1">
                                    {{ schedule.start_datetime.strftime('%H:%M') }} - {{ schedule.end_datetime.strftime('%H:%M') }}
                                </h6>
                                <small>
                                    {% if schedule.status == 'scheduled' %}
                                    <span class="badge bg-warning">Agendado</span>
                                    {% elif schedule.status == 'confirmed' %}
                                    <span class="badge bg-success">Confirmado</span>
                                    {% endif %}
                                </small>
                            </div>
                            <p class="mb-1">
                                <strong>{{ schedule.vehicle.plate }}</strong> - {{ schedule.driver.name }}
                            </p>
                            <small>{{ schedule.department.name }}</small>
                            {% if schedule.purpose %}
                            <div class="mt-2 small text-muted">
                                {{ schedule.purpose|truncate(100) }}
                            </div>
                            {% endif %}
                            <div class="mt-2">
                                <a href="{{ url_for('schedules.detail_schedule', schedule_id=schedule.id) }}" class="btn btn-sm btn-info">
                                    <i class="bi bi-eye"></i> Detalhes
                                </a>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                    {% else %}
                    <p class="text-center py-3 text-muted">
                        <i class="bi bi-calendar-x"></i> Não há agendamentos para este dia.
                    </p>
                    {% endif %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
