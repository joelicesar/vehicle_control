<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block title %}Agendamentos Futuros{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Agendamentos Futuros</h2>
        <a href="{{ url_for('schedules.add_schedule') }}" class="btn btn-primary">
            <i class="bi bi-calendar-plus"></i> Novo Agendamento
        </a>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Próximos Agendamentos</h5>
        </div>
        <div class="card-body">
            {% if future_schedules %}
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Veículo</th>
                            <th>Motorista</th>
                            <th>Departamento</th>
                            <th>Início</th>
                            <th>Término Previsto</th>
                            <th>Finalidade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for schedule in future_schedules %}
                        <tr>
                            <td>{{ schedule.vehicle.plate }}</td>
                            <td>{{ schedule.driver.name }}</td>
                            <td>{{ schedule.department.name }}</td>
                            <td>{{ schedule.start_datetime.strftime('%d/%m/%Y %H:%M') }}</td>
                            <td>{{ schedule.end_datetime.strftime('%d/%m/%Y %H:%M') }}</td>
                            <td>{{ schedule.purpose }}</td>
                            <td>
                                {% if schedule.status == 'scheduled' %}
                                <span class="badge bg-info">Agendado</span>
                                {% elif schedule.status == 'confirmed' %}
                                <span class="badge bg-success">Confirmado</span>
                                {% elif schedule.status == 'cancelled' %}
                                <span class="badge bg-danger">Cancelado</span>
                                {% endif %}
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <a href="{{ url_for('schedules.detail_schedule', schedule_id=schedule.id) }}" class="btn btn-info">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a href="{{ url_for('schedules.edit_schedule', schedule_id=schedule.id) }}" class="btn btn-warning">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#cancelScheduleModal{{ schedule.id }}">
                                        <i class="bi bi-x-circle"></i>
                                    </button>
                                </div>

                                <!-- Modal de confirmação de cancelamento -->
                                <div class="modal fade" id="cancelScheduleModal{{ schedule.id }}" tabindex="-1" aria-labelledby="cancelScheduleModalLabel{{ schedule.id }}" aria-hidden="true">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header bg-danger text-white">
                                                <h5 class="modal-title" id="cancelScheduleModalLabel{{ schedule.id }}">Confirmar Cancelamento</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <div class="modal-body">
                                                <p>Tem certeza que deseja cancelar o agendamento do veículo <strong>{{ schedule.vehicle.plate }}</strong> para <strong>{{ schedule.driver.name }}</strong>?</p>
                                                <p class="text-danger"><small>Esta ação não pode ser desfeita.</small></p>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
                                                <form action="{{ url_for('schedules.cancel_schedule', schedule_id=schedule.id) }}" method="POST" class="d-inline">
                                                    <button type="submit" class="btn btn-danger">Cancelar Agendamento</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <div class="text-center py-4">
                <i class="bi bi-calendar-x fs-1 text-muted"></i>
                <p class="text-muted">Nenhum agendamento futuro encontrado.</p>
                <a href="{{ url_for('schedules.add_schedule') }}" class="btn btn-primary">
                    <i class="bi bi-calendar-plus"></i> Agendar Veículo
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
