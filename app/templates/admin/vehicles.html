<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>    {# app/templates/admin/vehicles.html #}
    {% extends "base.html" %}

    {% block content %}
    <div class="container mt-4">
        <h1>Gerenciar Veículos</h1>
        <a href="{{ url_for('admin.add_vehicle') }}" class="btn btn-primary mb-3">Adicionar Novo Veículo</a>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Placa</th>
                    <th>Modelo</th>
                    <th>Ano</th>
                    <th>Cor</th>
                    <th>Status</th>
                    <th>KM Atual</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for vehicle in vehicles %}
                <tr>
                    <td>{{ vehicle.id }}</td>
                    <td>{{ vehicle.plate }}</td>
                    <td>{{ vehicle.model }}</td>
                    <td>{{ vehicle.year }}</td>
                    <td>{{ vehicle.color }}</td>
                    <td>{{ vehicle.status }}</td>
                    <td>{{ vehicle.current_km }}</td>
                    <td>
                        <a href="{{ url_for('admin.edit_vehicle', vehicle_id=vehicle.id) }}" class="btn btn-sm btn-warning">Editar</a>
                        <form action="{{ url_for('admin.delete_vehicle', vehicle_id=vehicle.id) }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja excluir este veículo?');">Excluir</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="8">Nenhum veículo cadastrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% endblock %}
</title>
</head>
<body>

</body>
</html>
