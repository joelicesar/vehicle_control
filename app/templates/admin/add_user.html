<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}

{% block title %}Adicionar Usuário{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Adicionar Usuário</h2>
        <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Dados do Usuário</h5>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('admin.add_user') }}">
                {{ form.hidden_tag() }}

                <div class="mb-3">
                    <label for="username" class="form-label">Nome de Usuário:</label>
                    {{ form.username(class="form-control", id="username") }}
                    {% if form.username.errors %}
                        <div class="text-danger">
                            {% for error in form.username.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail:</label>
                    {{ form.email(class="form-control", id="email") }}
                    {% if form.email.errors %}
                        <div class="text-danger">
                            {% for error in form.email.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha:</label>
                    {{ form.password(class="form-control", id="password") }}
                    {% if form.password.errors %}
                        <div class="text-danger">
                            {% for error in form.password.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="type" class="form-label">Tipo:</label>
                    {{ form.type(class="form-select", id="type") }}
                    {% if form.type.errors %}
                        <div class="text-danger">
                            {% for error in form.type.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="{{ url_for('admin.users') }}" class="btn btn-secondary me-md-2">Cancelar</a>
                    {{ form.submit(class="btn btn-primary") }}
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
