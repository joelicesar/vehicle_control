<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>    {# app/templates/admin/add_edit_vehicle.html #}
    {% extends "base.html" %}

    {% block content %}
    <div class="container mt-4">
        <h1>{{ title }}</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    {{ form.hidden_tag() }}

                    <div class="mb-3">
                        {{ form.plate.label(class="form-label") }}
                        {{ form.plate(class="form-control") }}
                        {% for error in form.plate.errors %}
                            <span class="text-danger">{{ error }}</span>
                        {% endfor %}
                    </div>

                    <div class="mb-3">
                        {{ form.model.label(class="form-label") }}
                        {{ form.model(class="form-control") }}
                        {% for error in form.model.errors %}
                            <span class="text-danger">{{ error }}</span>
                        {% endfor %}
                    </div>

                    <div class="mb-3">
                        {{ form.year.label(class="form-label") }}
                        {{ form.year(class="form-control") }}
                        {% for error in form.year.errors %}
                            <span class="text-danger">{{ error }}</span>
                        {% endfor %}
                    </div>

                    <div class="mb-3">
                        {{ form.color.label(class="form-label") }}
                        {{ form.color(class="form-control") }}
                        {% for error in form.color.errors %}
                            <span class="text-danger">{{ error }}</span>
                        {% endfor %}
                    </div>

                    <div class="mb-3">
                        {{ form.status.label(class="form-label") }}
                        {{ form.status(class="form-select") }}
                        {% for error in form.status.errors %}
                            <span class="text-danger">{{ error }}</span>
                        {% endfor %}
                    </div>

                    <div class="mb-3">
                        {{ form.current_km.label(class="form-label") }}
                        {{ form.current_km(class="form-control") }}
                        {% for error in form.current_km.errors %}
                            <span class="text-danger">{{ error }}</span>
                        {% endfor %}
                    </div>

                    <div class="mb-3">
                        {{ form.purchase_date.label(class="form-label") }}
                        {{ form.purchase_date(class="form-control", type="date") }}
                        {% for error in form.purchase_date.errors %}
                            <span class="text-danger">{{ error }}</span>
                        {% endfor %}
                    </div>

                    <div class="mb-3">
                        {{ form.notes.label(class="form-label") }}
                        {{ form.notes(class="form-control", rows="3") }}
                        {% for error in form.notes.errors %}
                            <span class="text-danger">{{ error }}</span>
                        {% endfor %}
                    </div>

                    <div class="d-grid gap-2">
                        {{ form.submit(class="btn btn-primary") }}
                    </div>
                </form>
            </div>
        </div>
    </div>
    {% endblock %}
</title>
</head>
<body>

</body>
</html>
