<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{# app/templates/admin/departments.html #}
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Gerenciar Departamentos</h1>
    <a href="{{ url_for('admin.add_department') }}" class="btn btn-primary mb-3">Adicionar Novo Departamento</a>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Descrição</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for department in departments %}
                <tr>
                    <td>{{ department.id }}</td>
                    <td>{{ department.name }}</td>
                    <td>{{ department.description if department.description else 'N/A' }}</td>
                    <td>
                        <a href="{{ url_for('admin.edit_department', department_id=department.id) }}" class="btn btn-sm btn-warning me-2">Editar</a>
                        <form action="{{ url_for('admin.delete_department', department_id=department.id) }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja excluir o departamento {{ department.name }}?');">Excluir</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="text-center">Nenhum departamento cadastrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
