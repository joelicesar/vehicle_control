<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{# app/templates/admin/drivers.html #}
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Gerenciar Motoristas</h1>
    <a href="{{ url_for('admin.add_driver') }}" class="btn btn-primary mb-3">Adicionar Novo Motorista</a>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nome</th>
                    <th scope="col">CNH</th>
                    <th scope="col">Validade CNH</th>
                    <th scope="col">Telefone</th>
                    <th scope="col">Status</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for driver in drivers %}
                <tr>
                    <td>{{ driver.id }}</td>
                    <td>{{ driver.name }}</td>
                    <td>{{ driver.license_number }}</td>
                    <td>{{ driver.license_expiration|date }}</td> {# Usando o filtro de data #}
                    <td>{{ driver.phone }}</td>
                    <td>{{ driver.status.capitalize() }}</td>
                    <td>
                        <a href="{{ url_for('admin.edit_driver', driver_id=driver.id) }}" class="btn btn-sm btn-warning me-2">Editar</a>
                        <form action="{{ url_for('admin.delete_driver', driver_id=driver.id) }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja excluir o motorista {{ driver.name }}?');">Excluir</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="7" class="text-center">Nenhum motorista cadastrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
